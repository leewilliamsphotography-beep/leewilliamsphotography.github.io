<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updating</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030303;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .container {
    text-align: center;
    position: relative;
  }

  .ring {
    width: 72px;
    height: 72px;
    margin: 0 auto 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.06);
    border-top-color: #38BDF8;
    border-right-color: #A855F7;
    animation: spin 1s linear infinite;
    position: relative;
    filter: drop-shadow(0 0 8px rgba(168,85,247,0.4));
  }

  .ring::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #F43F5E;
    border-left-color: #34D399;
    animation: spin 1.5s linear reverse infinite;
    filter: drop-shadow(0 0 8px rgba(244,63,94,0.4));
  }

  .ring::before {
    content: '';
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-bottom-color: #FACC15;
    border-right-color: #38BDF8;
    animation: spin 2s linear infinite;
    filter: drop-shadow(0 0 6px rgba(250,204,21,0.3));
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #38BDF8 0%, #A855F7 25%, #F43F5E 50%, #FACC15 75%, #34D399 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease-in-out infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  p {
    font-size: 0.875rem;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
  }

  .dots span {
    animation: dotPulse 1.4s ease-in-out infinite;
    opacity: 0;
  }
  .dots span:nth-child(1) { animation-delay: 0s; color: #38BDF8; }
  .dots span:nth-child(2) { animation-delay: 0.2s; color: #A855F7; }
  .dots span:nth-child(3) { animation-delay: 0.4s; color: #F43F5E; }

  @keyframes dotPulse {
    0%, 60%, 100% { opacity: 0; }
    30% { opacity: 1; }
  }

  .glow {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 160px;
    background: radial-gradient(circle,
      rgba(168,85,247,0.15) 0%,
      rgba(56,189,248,0.1) 30%,
      rgba(244,63,94,0.05) 60%,
      transparent 70%
    );
    pointer-events: none;
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
    animation: float 6s ease-in-out infinite;
  }

  .particle:nth-child(1)  { left: 10%; top: 20%; background: #38BDF8; animation-delay: 0s; animation-duration: 7s; }
  .particle:nth-child(2)  { left: 80%; top: 15%; background: #A855F7; animation-delay: 1s; animation-duration: 5s; }
  .particle:nth-child(3)  { left: 25%; top: 75%; background: #F43F5E; animation-delay: 2s; animation-duration: 8s; }
  .particle:nth-child(4)  { left: 70%; top: 80%; background: #FACC15; animation-delay: 0.5s; animation-duration: 6s; }
  .particle:nth-child(5)  { left: 50%; top: 10%; background: #34D399; animation-delay: 3s; animation-duration: 7.5s; }
  .particle:nth-child(6)  { left: 90%; top: 50%; background: #38BDF8; animation-delay: 1.5s; animation-duration: 6.5s; }
  .particle:nth-child(7)  { left: 5%;  top: 55%; background: #A855F7; animation-delay: 2.5s; animation-duration: 5.5s; }
  .particle:nth-child(8)  { left: 40%; top: 90%; background: #F43F5E; animation-delay: 0.8s; animation-duration: 8.5s; }
  .particle:nth-child(9)  { left: 60%; top: 40%; background: #34D399; animation-delay: 3.5s; animation-duration: 6s; }
  .particle:nth-child(10) { left: 15%; top: 35%; background: #FACC15; animation-delay: 4s; animation-duration: 7s; }

  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    20%  { opacity: 0.8; }
    50%  { opacity: 0.6; transform: translateY(-40px) scale(1); }
    80%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
  }

  .progress-track {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.05);
  }

  .progress-bar {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #38BDF8, #A855F7, #F43F5E, #FACC15, #34D399);
    background-size: 200% 100%;
    border-radius: 0 3px 3px 0;
    animation: slide 2s ease-in-out infinite, barGradient 2s linear infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(450%); }
  }

  @keyframes barGradient {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }
</style>
</head>
<body>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <div class="glow"></div>
    <div class="ring"></div>
    <h1>Updates on the way!</h1>
    <p>We'll be right back<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>

  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>

</body>
</html>
