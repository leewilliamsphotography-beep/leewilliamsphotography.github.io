<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Emma's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:500px;margin:0 auto;position:relative;overflow:hidden}
.bg-anim{position:absolute;inset:0;z-index:0;background-size:400% 400%;animation:gs 12s ease infinite;will-change:background-position}
@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 100%}100%{background-position:0% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:bf 8s ease-in-out infinite;pointer-events:none;z-index:0;will-change:transform}
.blob:nth-child(2){animation-delay:-3s;animation-duration:10s}
.blob:nth-child(3){animation-delay:-6s;animation-duration:7s}
@keyframes bf{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-35px) scale(1.08)}}
.safe-top{height:env(safe-area-inset-top,0px);flex-shrink:0;transition:background .5s;z-index:1;position:relative}
.safe-bottom{height:env(safe-area-inset-bottom,0px);flex-shrink:0;position:relative;z-index:1}
.hdr{padding:12px 16px;text-align:center;flex-shrink:0;position:relative;overflow:hidden;z-index:1;transition:background .5s}
.hdr::after{content:'';position:absolute;bottom:-20px;left:-20px;right:-20px;height:40px;border-radius:50%;transition:background .5s}
.hdr h1{font-family:'Quicksand',sans-serif;font-weight:700;font-size:20px;color:#fff;position:relative;z-index:1}
.hdr .sub{font-family:'Quicksand',sans-serif;font-weight:600;font-size:12px;opacity:.8;margin-top:1px;position:relative;z-index:1;color:#fff;transition:color .5s}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;flex-shrink:0;position:relative;z-index:1}
.nav button{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s,transform .12s;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.nav button:active{transform:scale(.9)}
.nav button[disabled]{opacity:.25;pointer-events:none}
.nav .ml{font-family:'Quicksand',sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:5px;transition:color .5s}
.nav .me{font-size:18px}
.leg{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:2px 8px 6px;flex-shrink:0;position:relative;z-index:1}
.lc{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:10px;font-size:9px;font-weight:600;border:1px solid rgba(255,255,255,.4);box-shadow:0 1px 3px rgba(0,0,0,.05);transition:background .5s,border-color .5s}
.ld{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;flex-shrink:0}
.slider-track{display:flex;width:300%;transition:transform .32s cubic-bezier(.4,0,.2,1);will-change:transform}
.slider-track.no-anim{transition:none}
.slide-panel{width:33.333%;flex-shrink:0;padding:0 8px 8px}
.cw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.dh{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px;margin-bottom:3px}
.dht{text-align:center;font-family:'Quicksand',sans-serif;font-weight:700;font-size:10px;padding:4px 0;border-radius:6px;transition:background .5s,color .5s}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;contain:layout style}
.c{border-radius:8px;padding:3px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:flex-start;gap:1px;min-height:52px;position:relative;overflow:hidden;transition:transform .12s,background .5s,border-color .5s;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;contain:layout style}
.c:active{transform:scale(.95)}
.c.e{background:transparent!important;border-color:transparent!important;min-height:0;padding:0;box-shadow:none;cursor:default}
.c.su{transition:background .5s,border-color .5s}
.c .n{font-weight:800;font-size:12px;line-height:1.1;position:relative;z-index:1}
.c .b{padding:1px 3px;border-radius:4px;font-size:6px;font-weight:700;color:#fff;text-align:center;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ft{text-align:center;padding:3px;font-size:9px;opacity:.3;font-weight:600;flex-shrink:0;transition:color .5s}
.af{text-align:center;padding:8px 12px;border-top:1.5px solid rgba(255,255,255,.3);flex-shrink:0;transition:border-color .5s;position:relative;z-index:1}
.af .fl{font-size:12px;letter-spacing:2px;margin-bottom:1px;animation:fb 3s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.af p{font-size:8px;opacity:.5;font-weight:600;transition:color .5s}
.dl{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dl svg{width:100%;height:100%;display:block}
.mo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.mo.sh{opacity:1;pointer-events:auto}
.ms{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:500px;max-height:75vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.mo.sh .ms{transform:translateY(0)}
.mh{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 12px}
.mt{font-family:'Quicksand',sans-serif;font-weight:700;font-size:16px;margin-bottom:3px;color:#333}
.md{font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:#888;margin-bottom:12px}
.mel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.me-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#f5f5f5;transition:transform .12s}
.me-item:active{transform:scale(.98)}
.mec{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mel-label{flex:1;font-weight:600;font-size:12px;color:#333}
.met{font-size:8px;font-weight:700;padding:1px 5px;border-radius:5px;color:#fff;flex-shrink:0;letter-spacing:.3px}
.med{width:28px;height:28px;border:none;border-radius:50%;background:rgba(244,67,54,.1);color:#f44336;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.med:active{background:rgba(244,67,54,.25)}
.mar{display:flex;gap:6px}
.mi{flex:1;height:40px;border:2px solid #e0e0e0;border-radius:10px;padding:0 12px;font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;outline:none;transition:border-color .2s}
.mi:focus{border-color:#e91e63}
.mcs{display:flex;gap:5px;align-items:center}
.mcb{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .12s,border-color .15s}
.mcb:active{transform:scale(.9)}
.mcb.pk{border-color:#333}
.mab{height:40px;padding:0 16px;border:none;border-radius:10px;background:#e91e63;color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .12s}
.mab:active{transform:scale(.95);background:#c2185b}
.mcl{width:100%;height:40px;border:none;border-radius:10px;background:#f5f5f5;color:#666;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;transition:background .15s}
.mcl:active{background:#e0e0e0}
@media(prefers-reduced-motion:reduce){
  .slider-track{transition:none!important}.bg-anim{animation:none!important}
  .blob{animation:none!important}.af .fl{animation:none!important}
  *{transition-duration:0s!important;animation-duration:0s!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bg-anim" id="bgA"></div>
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div class="blob" id="b3"></div>
  <div class="safe-top" id="safeTop"></div>
  <div class="dl"><svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 500 1200" id="dSvg"></svg></div>
  <div class="hdr" id="hdr"><h1>Emma's Calendar</h1><div class="sub" id="hSub">2026</div></div>
  <div class="nav">
    <button id="pB" aria-label="Previous month">&#9664;</button>
    <div class="ml" id="mLbl"></div>
    <button id="nB" aria-label="Next month">&#9654;</button>
  </div>
  <div class="leg" id="leg"></div>
  <div class="cw" id="cw">
    <div class="dh" id="dh"></div>
    <div class="slider-track no-anim" id="sT">
      <div class="slide-panel"><div class="cg" id="gL"></div></div>
      <div class="slide-panel"><div class="cg" id="gC"></div></div>
      <div class="slide-panel"><div class="cg" id="gR"></div></div>
    </div>
    <div class="ft" id="ftH">tap a day to edit</div>
  </div>
  <div class="af" id="af">
    <div class="fl" id="fFl"></div>
    <p>Emma's Routine Calendar &#8212; Have a lovely day!</p>
  </div>
  <div class="safe-bottom"></div>
</div>
<div class="mo" id="mo">
  <div class="ms">
    <div class="mh"></div>
    <div class="mt">Edit Entries</div>
    <div class="md" id="mD"></div>
    <div class="mel-list" id="mL"></div>
    <div class="mar">
      <input class="mi" id="mI" type="text" placeholder="New entry..." maxlength="20" autocomplete="off">
      <div class="mcs" id="mCs"></div>
      <button class="mab" id="mAB">Add</button>
    </div>
    <button class="mcl" id="mCL">Close</button>
  </div>
</div>

<script>
/* Emoji helpers */
function E(c){return String.fromCodePoint(c)}
var EC=E(0x1F6D2),ES=E(0x1F3CA),EB=E(0x1F9F9),EF=E(0x1F3AC),EW=E(0x1F4BC),ECA=E(0x1F4C5);
var S1=E(0x2744),S2=E(0x26C4),S3=E(0x1F328),TU=E(0x1F337),SF=E(0x1F33B),CH=E(0x1F338),BF=E(0x98B),SU=E(0x2600),HI=E(0x1F33A),ME=E(0x1F349),BE=E(0x1F3D6);
var L1=E(0x1F342),L2=E(0x1F341),NU=E(0x1F330),PU=E(0x1F383),XM=E(0x1F384),HT=E(0x1F496);
var EG=E(0x1F95A),EK=E(0x1F420),EBN=E(0x1F380),EBL=E(0x1F308),EFL=E(0x1F33C);
var GH=E(0x1F47B),SK=E(0x1F378),BT=E(0x1F383),WN=E(0x1F43A),SP=E(0x1F47E),CT=E(0x1F479),MU=E(0x1F9B8);
var SD=E(0x1F384),TR=E(0x1F385),NO=E(0x1F386),RD=E(0x1F381);

/* Detect reduced-motion preference early */
var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* SVG decoration builders - each returns a string */
function sf(x,y,s,o){
  var h='<g opacity="'+o+'" stroke="#64b5f6" stroke-width="'+Math.max(1,s/8)+'" stroke-linecap="round">';
  for(var a=0;a<360;a+=60){var r=a*Math.PI/180;
    h+='<line x1="'+x+'" y1="'+y+'" x2="'+(x+s*Math.cos(r))+'" y2="'+(y+s*Math.sin(r))+'"/>';
    var b=s*.55,bx=x+b*Math.cos(r),by=y+b*Math.sin(r);
    h+='<line x1="'+bx+'" y1="'+by+'" x2="'+(bx+s*.3*Math.cos(r+.7))+'" y2="'+(by+s*.3*Math.sin(r+.7))+'"/>';
    h+='<line x1="'+bx+'" y1="'+by+'" x2="'+(bx+s*.3*Math.cos(r-.7))+'" y2="'+(by+s*.3*Math.sin(r-.7))+'"/>';
  }return h+'</g>';
}
function bt(x,y,s,o,c){
  c=c||'#5d4037';var h=130*s,w=70*s;
  return '<g opacity="'+o+'" stroke="'+c+'" stroke-linecap="round" fill="none">'+
    '<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-h)+'" stroke-width="'+(4*s)+'"/>'+
    '<line x1="'+x+'" y1="'+(y-h)+'" x2="'+(x-w*.4)+'" y2="'+(y-h-w*.9)+'" stroke-width="'+(2.5*s)+'"/>'+
    '<line x1="'+x+'" y1="'+(y-h)+'" x2="'+(x+w*.4)+'" y2="'+(y-h-w*.7)+'" stroke-width="'+(2*s)+'"/>'+
    '<line x1="'+x+'" y1="'+(y-h*.6)+'" x2="'+(x-w*.35)+'" y2="'+(y-h*.85)+'" stroke-width="'+(1.8*s)+'"/>'+
    '<line x1="'+x+'" y1="'+(y-h*.7)+'" x2="'+(x+w*.3)+'" y2="'+(y-h*.9)+'" stroke-width="'+(1.5*s)+'"/></g>';
}
function df(x,y,r,c1,c2,o){
  var h='<g opacity="'+o+'">';
  for(var a=0;a<360;a+=72)h+='<ellipse cx="'+x+'" cy="'+(y-r*.8)+'" rx="'+r+'" ry="'+(r*.5)+'" transform="rotate('+a+' '+x+' '+(y-r*.8)+')" fill="'+c1+'"/>';
  return h+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*.4)+'" fill="'+c2+'"/></g>';
}
function bf(x,y,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+')">'+
    '<ellipse cx="0" cy="-5" rx="12" ry="8" fill="#e91e63"/>'+
    '<ellipse cx="-14" cy="4" rx="10" ry="6" fill="#f06292" transform="rotate(-20 0 4)"/>'+
    '<ellipse cx="14" cy="4" rx="10" ry="6" fill="#f06292" transform="rotate(20 0 4)"/>'+
    '<ellipse cx="0" cy="6" rx="2" ry="10" fill="#4a148c"/></g>';
}
function lf(x,y,s,c,r,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+') rotate('+r+')">'+
    '<ellipse rx="'+s+'" ry="'+(s*.45)+'" fill="'+c+'"/>'+
    '<line x1="0" y1="'+(-s*.8)+'" x2="0" y2="'+(s*.8)+'" stroke="'+c+'" stroke-width="2" opacity=".5"/></g>';
}
function fl(x,y,s,c,r,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+') rotate('+r+')">'+
    '<ellipse rx="'+s+'" ry="'+(s*.5)+'" fill="'+c+'"/>'+
    '<line x1="0" y1="'+(-s*.9)+'" x2="0" y2="'+(s*.9)+'" stroke="'+c+'" stroke-width="2" opacity=".4"/></g>';
}
function su(x,y,r,o){
  var h='<g opacity="'+o+'"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#ffb74d"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.7)+'" fill="#ffd54f"/>';
  for(var a=0;a<360;a+=45){var d=a*Math.PI/180;
    h+='<line x1="'+(x+r*1.3*Math.cos(d))+'" y1="'+(y+r*1.3*Math.sin(d))+'" x2="'+(x+r*2*Math.cos(d))+'" y2="'+(y+r*2*Math.sin(d))+'" stroke="#ffb74d" stroke-width="3" stroke-linecap="round"/>';
  }return h+'</g>';
}
function wv(yPos,o){
  return '<path d="M0 '+yPos+' Q125 '+(yPos-15)+' 250 '+yPos+' Q375 '+(yPos+15)+' 500 '+yPos+'" fill="none" stroke="rgba(255,183,77,0.5)" stroke-width="2.5" opacity="'+o+'"/>';
}
function ee(x,y,r,c1,c2,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+')">'+
    '<ellipse rx="'+r+'" ry="'+(r*1.3)+'" fill="'+c1+'"/>'+
    '<path d="M0 '+(-r*1.3)+' Q'+(r*.3)+' '+(-r*1.6)+' 0 '+(-r*1.5)+' Q'+(-r*.3)+' '+(-r*1.6)+' 0 '+(-r*1.3)+'Z" fill="'+c1+'"/>'+
    '<ellipse cy="'+(-r*.5)+'" rx="'+(r*.6)+'" ry="'+(r*.15)+'" fill="'+c2+'" opacity=".7"/>'+
    '<ellipse cy="'+(r*.2)+'" rx="'+(r*.7)+'" ry="'+(r*.15)+'" fill="'+c2+'" opacity=".7"/>'+
    '<ellipse cy="'+(r*.8)+'" rx="'+(r*.5)+'" ry="'+(r*.12)+'" fill="'+c2+'" opacity=".7"/></g>';
}
function xt(x,y,h,o){
  var w=h*.8;
  return '<g opacity="'+o+'" transform="translate('+x+','+y+')">'+
    '<rect x="-5" y="0" width="10" height="'+(h*.2)+'" rx="2" fill="#5d4037"/>'+
    '<polygon points="0,'+(-h)+' '+(-w*.2)+','+(-h*.4)+' '+(w*.2)+','+(-h*.4)+'" fill="#2e7d32"/>'+
    '<polygon points="0,'+(-h*.85)+' '+(-w*.35)+','+(-h*.25)+' '+(w*.35)+','+(-h*.25)+'" fill="#388e3c"/>'+
    '<polygon points="0,'+(-h*.65)+' '+(-w*.5)+','+(-h*.05)+' '+(w*.5)+','+(-h*.05)+'" fill="#43a047"/>'+
    '<circle cx="0" cy="'+(-h*.9)+'" r="5" fill="#ffd54f"/>'+
    '<circle cx="'+(-w*.12)+'" cy="'+(-h*.55)+'" r="3" fill="#e91e63"/>'+
    '<circle cx="'+(w*.15)+'" cy="'+(-h*.35)+'" r="3" fill="#29b6f6"/>'+
    '<circle cx="'+(-w*.08)+'" cy="'+(-h*.15)+'" r="3" fill="#ff9800"/>'+
    '<circle cx="'+(w*.2)+'" cy="'+(-h*.7)+'" r="3" fill="#ab47bc"/></g>';
}
function pk(x,y,r,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+')">'+
    '<ellipse rx="'+r+'" ry="'+(r*.85)+'" fill="#e65100"/>'+
    '<ellipse cx="'+(-r*.35)+'" rx="'+(r*.55)+'" ry="'+(r*.75)+'" fill="#ef6c00"/>'+
    '<ellipse cx="'+(r*.35)+'" rx="'+(r*.55)+'" ry="'+(r*.75)+'" fill="#ef6c00"/>'+
    '<rect x="-3" y="'+(-r*.85-10)+'" width="6" height="12" rx="3" fill="#33691e"/>'+
    '<polygon points="0,'+(-r*.35)+' '+(-r*.2)+','+(r*.05)+' 0,'+(-r*.05)+'" fill="#ffd54f" opacity=".9"/>'+
    '<polygon points="0,'+(-r*.35)+' '+(r*.2)+','+(r*.05)+' 0,'+(-r*.05)+'" fill="#ffb74d" opacity=".9"/>'+
    '<ellipse cx="'+(-r*.3)+'" cy="'+(-r*.2)+'" rx="4" ry="5" fill="#ffd54f" opacity=".9"/>'+
    '<ellipse cx="'+(r*.3)+'" cy="'+(r*.2)+'" rx="4" ry="5" fill="#ffd54f" opacity=".9"/></g>';
}
function ba(x,y,s,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+') scale('+s+')">'+
    '<ellipse cx="0" cy="0" rx="5" ry="7" fill="#1a1a2e"/>'+
    '<path d="M-5 -3 Q-25 -20 -30 -5 Q-25 0 -15 5 Q-10 2 -5 0" fill="#1a1a2e"/>'+
    '<path d="M5 -3 Q25 -20 30 -5 Q25 0 15 5 Q10 2 5 0" fill="#1a1a2e"/>'+
    '<circle cx="-2" cy="-2" r="1.5" fill="#ff5722"/>'+
    '<circle cx="2" cy="-2" r="1.5" fill="#ff5722"/></g>';
}
function cc(x,y,h,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+')">'+
    '<path d="M0 '+h+' Q0 0 '+(h*.3)+' '+(-h*.1)+' Q'+(h*.5)+' '+(-h*.3)+' '+(h*.3)+' '+(-h*.4)+'" fill="none" stroke="#e53935" stroke-width="8" stroke-linecap="round"/>'+
    '<path d="M0 '+h+' L0 0" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8" opacity=".7"/></g>';
}
function sk(x,y,s,o){
  return '<g opacity="'+o+'" transform="translate('+x+','+y+') scale('+s+')">'+
    '<path d="M0 0 L0 40 Q0 55 -15 55 L-25 55 Q-30 55 -28 48 L-18 30 Q-10 18 0 0Z" fill="#e53935"/>'+
    '<path d="M0 0 Q10 -5 12 0 L12 12 Q10 15 0 12Z" fill="#e53935"/>'+
    '<rect x="-2" y="-5" width="16" height="10" rx="3" fill="#43a047"/>'+
    '<circle cx="-12" cy="40" r="4" fill="#ffd54f"/>'+
    '<circle cx="-8" cy="48" r="3" fill="#29b6f6"/></g>';
}
function ac2(x,y,animName,dur,delay,scale,o,emoji){
  if(!emoji) return '';
  return '<text x="'+x+'" y="'+y+'" font-size="'+(28*scale)+'" text-anchor="middle" dominant-baseline="central" opacity="'+o+'" style="animation:'+animName+' '+dur+'s ease-in-out '+delay+'s infinite">'+emoji+'</text>';
}

function eK(m,d){return YR+'-'+(m+1)+'-'+d}
function rK(m,d,c){return eK(m,d)+':'+c}
function iDR(m,d,c){return rD[rK(m,d,c)]===true}

/* Cached date lookups to avoid repeated Date construction */
var _dateCache={};
function getDateObj(m,d){
  var k=m*100+d;
  if(!_dateCache[k]) _dateCache[k]=new Date(YR,m,d);
  return _dateCache[k];
}
function getMonthDays(m){
  var k='dim'+m;
  if(!_dateCache[k]) _dateCache[k]=new Date(YR,m+1,0).getDate();
  return _dateCache[k];
}
function getMonthOffset(m){
  var k='off'+m;
  if(!_dateCache[k]) _dateCache[k]=(new Date(YR,m,1).getDay()+6)%7;
  return _dateCache[k];
}
/* Clear date cache when month changes */
function clearDateCache(){_dateCache={}}

/* Get all entries for a given month/day */
function gA(m,d){
  var o=[], d2=getDateObj(m,d), dw=d2.getDay();
  if(dw===1 && !iDR(m,d,'b-shop')) o.push({l:'Shopping',c:'b-shop',d:1});
  if(dw===2 && !iDR(m,d,'b-swim')) o.push({l:'Swimming',c:'b-swim',d:1});
  if(dw===3){
    if(!iDR(m,d,'b-swim')) o.push({l:'Swimming',c:'b-swim',d:1});
    if(!iDR(m,d,'b-clean')) o.push({l:'Cleaning',c:'b-clean',d:1});
  }
  if(dw===4){
    var fs=new Date(YR,0,8).getTime(), df2=Math.round((d2.getTime()-fs)/864e5);
    if(df2>=0 && (df2/7)%2===0 && !iDR(m,d,'b-film')) o.push({l:'Film Night',c:'b-film',d:1});
  }
  if(dw===5 && !iDR(m,d,'b-work')) o.push({l:'Work',c:'b-work',d:1});
  var cu=cE[eK(m,d)];
  if(cu) for(var i=0;i<cu.length;i++) o.push({l:cu[i].l, c:'b-c-'+cu[i].ci, d:0, ci:cu[i].ci});
  return o;
}

/* Determine theme for a month */
function gT(m){if(m===3)return'easter';if(m===9)return'halloween';if(m===11)return'christmas';return gS(m)}
function gS(m){if(m<=1)return'winter';if(m<=4)return'spring';if(m<=7)return'summer';return'autumn'}

document.head.appendChild(cSt);

/* Build calendar grid HTML for a month - uses array join for speed */
function bGH(m){
  var t=TH[gT(m)], dim=getMonthDays(m), off=getMonthOffset(m), parts=new Array(42), i, d, ev, bg, bd, j;
  /* Empty cells before day 1 */
  for(i=0;i<off;i++) parts[i]='<div class="c e"></div>';
  /* Day cells */
  for(d=1;d<=dim;d++){
    var isS=getDateObj(m,d).getDay()===0;
    ev=gA(m,d);
    bg=isS?t.csb:t.cbr;
    bd=isS?t.csb:t.cbr;
    var cell='<div class="c'+(isS?' su':'')+'" style="background:'+bg+';border-color:'+bd+'" data-d="'+d+'" data-m="'+m+'"><span class="n" style="color:'+t.nc+'">'+d+'</span>';
    for(j=0;j<ev.length;j++) cell+='<span class="b '+ev[j].c+'">'+ev[j].l+'</span>';
    parts[off+d-1]=cell+'</div>';
  }
  /* Empty cells after last day */
  var rem=(off+dim)%7;
  if(rem>0) for(i=0;i<7-rem;i++) parts[off+dim+i]='<div class="c e"></div>';
  /* Trim to actual size */
  var total=off+dim+(rem>0?7-rem:0);
  parts.length=total;
  return parts.join('');
}

/* Pre-built legend HTML cache per theme */
var _legCache={};
function buildLegendHTML(t){
  if(_legCache[t.s]) return _legCache[t.s];
  var parts=[];
  for(var i=0;i<LEG_ORDER.length;i++){
    var key=LEG_ORDER[i], info=DE[key];
    parts.push('<div class="lc" style="background:'+t.lg+';border-color:'+t.lbr+'"><span class="ld" style="background:'+info.g+'"></span>'+LEG_LABELS[key]+'</div>');
  }
  _legCache[t.s]=parts.join('');
  return _legCache[t.s];
}

/* Apply full theme for current month */
function applyTheme(m){
  var t=TH[gT(m)];
  $bgA.style.background=t.ba;
  $safeTop.style.background=t.st;

  /* Blobs - set once, skip on re-render if same theme group */
  var tKey=t.s;
  if($b1._tk!==tKey){
    $b1._tk=tKey;
    $b1.style.background=t.bl[0];
    $b2.style.background=t.bl[1];
    $b3.style.background=t.bl[2];
  }

  $hdr.style.background=t.hd;
  $hSub.style.color=t.hs;

  /* Header curve */
  if(!$hdr._hasStyle){
    $hdr._hasStyle=true;
    var as=document.createElement('style');as.id='haS';document.head.appendChild(as);
    $hdr._as=as;
  }
  $hdr._as.textContent='.hdr::after{background:'+t.ha+'!important}';

  /* Day headers - only update if theme changed */
  if($dhEls._tk!==tKey){
    $dhEls._tk=tKey;
    for(var h=0;h<$dhEls.length;h++){$dhEls[h].style.background=t.dhb;$dhEls[h].style.color=t.dhc}
  }

  $af.style.borderTopColor=t.fb;
  $afP.style.color=t.fc;
  $ftH.style.color=t.hc;

  $pB.style.background=t.bc; $pB.style.color=t.dhc;
  $nB.style.background=t.bc; $nB.style.color=t.dhc;
  $pB.style.opacity=cM===0?'.25':'1';
  $pB.disabled=cM===0;
  $nB.style.opacity=cM===11?'.25':'1';
  $nB.disabled=cM===11;

  $mLbl.innerHTML='<span class="me">'+mE[cM]+'</span> '+mN[cM];
  $mLbl.style.color=t.dhc;
  $hSub.textContent=t.s+' \u00B7 2026';
  $fFl.textContent=t.fl;

  /* Legend from cache */
  $leg.innerHTML=buildLegendHTML(t);

  /* SVG decorations */
  $dSvg.innerHTML=reducedMotion?'':t.d;

  /* Build calendar grids */
  var pv=cM>0?cM-1:11, nx=cM<11?cM+1:0;
  if(fr){
    $gL.innerHTML=bGH(cM);
    $gR.innerHTML=bGH(nx);
  } else {
    $gC.innerHTML=bGH(cM);
    $gL.innerHTML=bGH(pv);
    $gR.innerHTML=bGH(nx);
  }

  /* Position slider to show center panel */
  $sT.classList.add('no-anim');
  $sT.style.transform='translateX(-33.333%)';
  if(fr){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){$sT.classList.remove('no-anim');fr=false});
    });
  } else {
    void $sT.offsetWidth;
    $sT.classList.remove('no-anim');
  }
}

/* Navigate months */
function gM(dir){
  if(fr) return;
  var nm=cM+dir;
  if(nm<0||nm>11) return;
  $sT.style.transform=dir<0?'translateX(0%)':'translateX(-66.666%)';
  fr=true;
  clearDateCache();
  setTimeout(function(){
    cM=nm;
    applyTheme(cM);
    $cw.scrollTop=0;
  },320);
}

/* Wire up event listeners once */
function initEvents(){
  $pB.addEventListener('click',function(){gM(-1)});
  $nB.addEventListener('click',function(){gM(1)});

  /* Touch swipe */
  var tX=0, tY=0, sw=false;
  $cw.addEventListener('touchstart',function(ev){if(sw||fr)return;tX=ev.touches[0].clientX;tY=ev.touches[0].clientY},{passive:true});
  $cw.addEventListener('touchend',function(ev){
    if(sw||fr)return;
    var dx=ev.changedTouches[0].clientX-tX, dy=ev.changedTouches[0].clientY-tY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
      sw=true;
      if(dx<0)gM(1);else gM(-1);
      setTimeout(function(){sw=false},720);
    }
  },{passive:true});

  /* Keyboard */
  document.addEventListener('keydown',function(ev){if(ev.key==='ArrowLeft')gM(-1);if(ev.key==='ArrowRight')gM(1)});

  /* Calendar cell tap - delegate from slider */
  $sT.addEventListener('click',function(ev){
    var cell=ev.target.closest('.c');
    if(!cell||cell.classList.contains('e')) return;
    var d=parseInt(cell.getAttribute('data-d')), m=parseInt(cell.getAttribute('data-m'));
    if(!isNaN(d)&&!isNaN(m)) oM(m,d);
  });

  /* Modal */
  var mo=document.getElementById('mo');
  document.getElementById('mAB').addEventListener('click',aE);
  document.getElementById('mI').addEventListener('keydown',function(ev){if(ev.key==='Enter')aE()});
  document.getElementById('mCL').addEventListener('click',function(){mo.classList.remove('sh')});
  mo.addEventListener('click',function(ev){if(ev.target===mo)mo.classList.remove('sh')});
}

/* --- Modal (edit day entries) --- */
var mD=0, mmD=0;

function oM(m,d){
  mmD=m; mD=d;
  var d2=getDateObj(m,d), dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('mD').textContent=dn[d2.getDay()]+', '+mN[m]+' '+d+', '+YR;
  rML(); rCP();
  document.getElementById('mI').value='';
  document.getElementById('mo').classList.add('sh');
  setTimeout(function(){document.getElementById('mI').focus()},300);
}

/* Render modal entry list */
function rML(){
  var ev=gA(mmD,mD), list=document.getElementById('mL');
  if(!ev.length){
    list.innerHTML='<div style="text-align:center;padding:14px;color:#aaa;font-weight:600;font-size:12px">No entries for this day</div>';
    return;
  }
  var parts=[], dcIdx=0;
  for(var i=0;i<ev.length;i++){
    var e=ev[i], dc, tt, tbg;
    if(e.d===1){
      var info=DE[e.c]; dc=info.g; tt=info.l; tbg=info.c;
    } else {
      dc=CL[e.ci].g; tt='custom'; tbg=CL[e.ci].f;
    }
    parts.push('<div class="me-item"><div class="mec" style="background:'+dc+'"></div><div class="mel-label">'+e.l+'</div><span class="met" style="background:'+tbg+';color:#fff">'+tt+'</span><button class="med" data-idx="'+i+'" data-c="'+e.c+'" data-d="'+e.d+'">\u2715</button></div>');
  }
  list.innerHTML=parts.join('');

  /* Attach delete handlers via delegation */
  list.onclick=function(ev){
    var btn=ev.target.closest('.med');
    if(!btn) return;
    var isDefault=parseInt(btn.getAttribute('data-d'))===1;
    var idx=parseInt(btn.getAttribute('data-idx'));
    if(isDefault){
      var c=btn.getAttribute('data-c'), rk=rK(mmD,mD,c);
      rD[rk]=true; sR();
    } else {
      var k=eK(mmD,mD), cu=cE[k];
      if(!cu) return;
      var ev2=gA(mmD,mD), dcCount=0;
      for(var l=0;l<ev2.length;l++){if(ev2[l].d===1)dcCount++;else break;}
      var ci=idx-dcCount;
      if(ci>=0&&ci<cu.length){
        cu.splice(ci,1);
        if(!cu.length) delete cE[k];
        sC();
      }
    }
    rML(); rG();
  };
}

/* Render colour picker in modal */
function rCP(){
  var parts=[];
  for(var i=0;i<CL.length;i++) parts.push('<button class="mcb'+(i===pc?' pk':'')+'" style="background:'+CL[i].f+'" data-ci="'+i+'"></button>');
  var mcs=document.getElementById('mCs');
  mcs.innerHTML=parts.join('');
  mcs.onclick=function(ev){
    var btn=ev.target.closest('.mcb');
    if(!btn) return;
    pc=parseInt(btn.getAttribute('data-ci'));
    rCP();
  };
}

/* Add new custom entry */
function aE(){
  var inp=document.getElementById('mI'), label=inp.value.trim();
  if(!label) return;
  var k=eK(mmD,mD);
  if(!cE[k]) cE[k]=[];
  cE[k].push({l:label, ci:pc});
  sC(); inp.value=''; rML(); rG();
}

/* Rebuild all three calendar grids (after entry changes) */
function rG(){
  var pv=cM>0?cM-1:11, nx=cM<11?cM+1:0;
  $gC.innerHTML=bGH(cM);
  $gL.innerHTML=bGH(pv);
  $gR.innerHTML=bGH(nx);
}

/* Floating emoji keyframe animations */
var floatStyle=document.createElement('style');
floatStyle.textContent=
  '@keyframes ch{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}'+
  '@keyframes cw{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(4px) rotate(2deg)}75%{transform:translateX(-4px) rotate(-2deg)}}'+
  '@keyframes cf{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}'+
  '@keyframes cs{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}'+
  '@keyframes cb{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(-10px) scaleY(.9)}50%{transform:translateY(0) scaleY(1.08)}70%{transform:translateY(-4px) scaleY(1)}}';
document.head.appendChild(floatStyle);

/* Build day-of-week header row (once) */
document.getElementById('dh').innerHTML='<div class="dht">Mon</div><div class="dht">Tue</div><div class="dht">Wed</div><div class="dht">Thu</div><div class="dht">Fri</div><div class="dht">Sat</div><div class="dht">Sun</div>';

/* Initialise and render */
initRefs();
initEvents();
applyTheme(0);
</script>
