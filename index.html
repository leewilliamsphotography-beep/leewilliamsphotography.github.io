<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-web-app-status-bar-style" content="black-translucent">
<title>Emma's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:100%;position:relative;overflow:hidden}
.bg-anim{position:absolute;inset:0;z-index:0;background-size:400% 400%;animation:gs 12s ease infinite;will-change:background-position;transition:background .65s ease}
@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 100%}100%{background-position:0% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:bf 8s ease-in-out infinite;pointer-events:none;z-index:0;will-change:transform;transition:background .65s ease}
.blob:nth-child(2){animation-delay:-3s;animation-duration:10s}
.blob:nth-child(3){animation-delay:-6s;animation-duration:7s}
@keyframes bf{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-35px) scale(1.08)}}
.safe-top{height:env(safe-area-inset-top,0px);flex-shrink:0;transition:background .65s ease;z-index:1;position:relative}
.safe-bottom{height:env(safe-area-inset-bottom,0px);flex-shrink:0;position:relative;z-index:1}
.hdr{padding:10px 16px;text-align:center;flex-shrink:0;position:relative;overflow:hidden;z-index:1;transition:background .65s ease}
.hdr::after{content:'';position:absolute;bottom:-20px;left:-20px;right:-20px;height:40px;border-radius:50%;transition:background .65s ease}
.hdr h1{font-family:'Quicksand',sans-serif;font-weight:700;font-size:clamp(16px,4.5vw,20px);color:#fff;position:relative;z-index:1}
.hdr .sub{font-family:'Quicksand',sans-serif;font-weight:600;font-size:clamp(10px,2.8vw,12px);opacity:.8;margin-top:1px;position:relative;z-index:1;color:#fff;transition:color .65s ease}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 3px;flex-shrink:0;position:relative;z-index:1}
.nav button{width:clamp(34px,9vw,40px);height:clamp(34px,9vw,40px);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,18px);transition:background .2s,transform .12s,background-color .65s ease,color .65s ease;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.nav button:active{transform:scale(.9)}
.nav button[disabled]{opacity:.25;pointer-events:none}
.nav .ml{font-family:'Quicksand',sans-serif;font-weight:700;font-size:clamp(13px,3.8vw,16px);display:flex;align-items:center;gap:5px;transition:color .65s ease}
.nav .me{font-size:clamp(14px,4vw,18px)}
.cw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.dh{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 6px;margin-bottom:2px}
.dht{text-align:center;font-family:'Quicksand',sans-serif;font-weight:700;font-size:clamp(9px,2.5vw,11px);padding:4px 0;border-radius:6px;transition:background .65s ease,color .65s ease}
.grid-wrap{position:relative;padding:0 6px 6px}
.color-wash{position:absolute;inset:-24px;border-radius:24px;opacity:0;pointer-events:none;z-index:2;transition:opacity .5s ease,transform .5s cubic-bezier(.4,0,.2,1);transform:scale(0.6)}
.color-wash.active{opacity:1;transform:scale(1.15)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;contain:layout style;position:relative;z-index:1;transition:opacity .32s cubic-bezier(.4,0,.2,1),transform .32s cubic-bezier(.4,0,.2,1),filter .32s cubic-bezier(.4,0,.2,1)}
.cg.blend-out{opacity:0;transform:scale(0.94);filter:blur(6px)}
.cg.blend-in{opacity:0;transform:scale(1.06);filter:blur(6px)}
.c{border-radius:8px;padding:3px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;min-height:clamp(44px,11.5vw,62px);position:relative;overflow:hidden;transition:transform .12s,background .65s ease,border-color .65s ease;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;contain:layout style}
.c:active{transform:scale(.95)}
.c.e{background:transparent!important;border-color:transparent!important;min-height:0;padding:0;box-shadow:none;cursor:default}
.c.su{transition:background .65s ease,border-color .65s ease}
.c .n{font-weight:800;font-size:clamp(10px,2.8vw,13px);line-height:1.1;position:relative;z-index:1}
.c .b{padding:2px 3px;border-radius:4px;font-size:clamp(5.5px,1.5vw,7.5px);font-weight:700;color:#fff;text-align:center;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ft{text-align:center;padding:2px;font-size:clamp(7px,2vw,9px);opacity:.3;font-weight:600;flex-shrink:0;transition:color .65s ease}
.credit{text-align:center;padding:4px 12px calc(4px + env(safe-area-inset-bottom,0px));font-family:'Quicksand',sans-serif;font-weight:600;font-size:clamp(8px,2.2vw,10px);opacity:.3;flex-shrink:0;transition:color .65s ease;letter-spacing:.3px;z-index:1;position:relative}
.dl{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dl svg{width:100%;height:100%;display:block}
.mo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.mo.sh{opacity:1;pointer-events:auto}
.ms{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:500px;max-height:75vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.mo.sh .ms{transform:translateY(0)}
.mh{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 12px}
.mt{font-family:'Quicksand',sans-serif;font-weight:700;font-size:16px;margin-bottom:3px;color:#333}
.md{font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:#888;margin-bottom:12px}
.mel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.me-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#f5f5f5;transition:transform .12s}
.me-item:active{transform:scale(.98)}
.mec{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mel-label{flex:1;font-weight:600;font-size:12px;color:#333}
.met{font-size:8px;font-weight:700;padding:1px 5px;border-radius:5px;color:#fff;flex-shrink:0;letter-spacing:.3px}
.med{width:28px;height:28px;border:none;border-radius:50%;background:rgba(244,67,54,.1);color:#f44336;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.med:active{background:rgba(244,67,54,.25)}
.mar{display:flex;gap:6px}
.mi{flex:1;height:40px;border:2px solid #e0e0e0;border-radius:10px;padding:0 12px;font-family:'Nunito',sans-serif;font-weight:600;font-size:12px;outline:none;transition:border-color .2s}
.mi:focus{border-color:#e91e63}
.mcs{display:flex;gap:5px;align-items:center}
.mcb{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .12s,border-color .15s}
.mcb:active{transform:scale(.9)}
.mcb.pk{border-color:#333}
.mab{height:40px;padding:0 16px;border:none;border-radius:10px;background:#e91e63;color:#fff;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .12s}
.mab:active{transform:scale(.95);background:#c2185b}
.mcl{width:100%;height:40px;border:none;border-radius:10px;background:#f5f5f5;color:#666;font-family:'Quicksand',sans-serif;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;transition:background .15s}
.mcl:active{background:#e0e0e0}

/* ── Responsive: small phone to large phone ── */
@media(min-width:420px){
  .app{max-width:420px;margin:0 auto;border-left:1px solid rgba(0,0,0,.06);border-right:1px solid rgba(0,0,0,.06)}
}

/* ── Responsive: large phone / small tablet portrait ── */
@media(min-width:520px){
  .app{max-width:520px}
  .c{min-height:clamp(50px,12vw,66px);padding:3px 4px}
  .c .n{font-size:clamp(11px,2.6vw,14px)}
  .c .b{font-size:clamp(6px,1.5vw,8px);padding:2px 3px}
  .dh,.grid-wrap{gap:3px;padding-left:8px;padding-right:8px}
  .dht{font-size:clamp(10px,2.2vw,12px)}
}

/* ── Responsive: tablet portrait ── */
@media(min-width:640px){
  .app{max-width:620px}
  .hdr{padding:12px 20px}
  .hdr h1{font-size:22px}
  .hdr .sub{font-size:13px}
  .c{min-height:clamp(56px,9vw,72px);padding:4px;border-radius:10px;gap:2px}
  .c .n{font-size:clamp(12px,2.2vw,15px)}
  .c .b{font-size:clamp(6.5px,1.2vw,8.5px);padding:2px 4px;border-radius:5px}
  .dht{font-size:clamp(10px,1.8vw,13px);padding:5px 0;border-radius:8px}
  .dh,.grid-wrap{gap:4px;padding-left:10px;padding-right:10px}
  .nav button{width:44px;height:44px;font-size:18px}
  .nav .ml{font-size:17px}
  .nav .me{font-size:20px}
  .ms{max-width:560px}
}

/* ── Responsive: tablet landscape / small desktop ── */
@media(min-width:900px){
  .app{max-width:800px}
  .hdr{padding:16px 24px}
  .hdr h1{font-size:26px}
  .hdr .sub{font-size:14px}
  .c{min-height:clamp(66px,8.2vw,88px);padding:5px;border-radius:12px;gap:3px;border-width:2.5px}
  .c .n{font-size:clamp(14px,1.8vw,18px)}
  .c .b{font-size:clamp(7.5px,1vw,10px);padding:3px 5px;border-radius:5px}
  .dht{font-size:clamp(11px,1.4vw,14px);padding:6px 0;border-radius:8px}
  .dh,.grid-wrap{gap:5px;padding-left:12px;padding-right:12px}
  .nav{padding:8px 16px 4px}
  .nav button{width:48px;height:48px;font-size:20px}
  .nav .ml{font-size:19px}
  .nav .me{font-size:22px}
  .credit{font-size:12px;padding:6px 16px}
  .color-wash{inset:-32px;border-radius:32px}
  /* Modal becomes centered dialog on larger screens */
  .mo{align-items:center}
  .ms{border-radius:20px;max-height:80vh;max-width:600px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
  .mh{width:40px;height:4px;margin-bottom:16px}
  .mt{font-size:18px}
  .md{font-size:14px;margin-bottom:14px}
  .me-item{padding:10px 14px;gap:10px;border-radius:12px}
  .mec{width:14px;height:14px}
  .mel-label{font-size:13px}
  .met{font-size:9px;padding:2px 7px}
  .med{width:32px;height:32px;font-size:16px}
  .mar{gap:8px}
  .mi{height:44px;font-size:13px;border-radius:12px}
  .mcb{width:32px;height:32px}
  .mab{height:44px;font-size:13px;border-radius:12px}
  .mcl{height:44px;font-size:13px;border-radius:12px;margin-top:8px}
}

/* ── Responsive: desktop ── */
@media(min-width:1200px){
  .app{max-width:920px}
  .hdr{padding:18px 28px}
  .hdr h1{font-size:28px}
  .c{min-height:clamp(76px,8vw,100px);padding:6px;border-radius:14px;gap:3px}
  .c .n{font-size:clamp(15px,1.6vw,19px)}
  .c .b{font-size:clamp(8px,0.9vw,11px);padding:3px 6px;border-radius:6px}
  .dht{font-size:clamp(12px,1.3vw,15px);padding:7px 0}
  .dh,.grid-wrap{gap:6px;padding-left:14px;padding-right:14px}
  .nav button{width:52px;height:52px;font-size:22px}
  .nav .ml{font-size:20px}
  .nav .me{font-size:24px}
  .ms{max-width:660px}
}

/* ── Responsive: large desktop ── */
@media(min-width:1600px){
  .app{max-width:1040px}
  .c{min-height:clamp(88px,7.5vw,115px);padding:7px}
  .c .n{font-size:clamp(16px,1.5vw,21px)}
  .c .b{font-size:clamp(9px,0.85vw,12px);padding:4px 7px}
  .dh,.grid-wrap{gap:7px}
}

/* ── Landscape: very tight (phone landscape) ── */
@media(max-height:440px) and (orientation:landscape){
  .safe-top,.safe-bottom{height:0}
  .hdr{padding:2px 12px}
  .hdr h1{font-size:14px}
  .hdr .sub{display:none}
  .hdr::after{display:none}
  .nav{padding:1px 8px}
  .nav button{width:28px;height:28px;font-size:12px}
  .nav .ml{font-size:12px}
  .nav .me{font-size:14px}
  .credit,.ft{display:none}
  .dl{display:none}
  .dht{font-size:8px;padding:1px 0}
  .dh,.grid-wrap{gap:2px;padding:0 4px}
  .grid-wrap{padding-bottom:4px}
  .c{min-height:28px!important;padding:1px;gap:0;border-radius:4px;border-width:1px}
  .c .n{font-size:9px}
  .c .b{font-size:4.5px;padding:0 1px;line-height:1.2;border-radius:2px}
  .color-wash{inset:-10px;border-radius:10px}
}

/* ── Landscape: medium tight ── */
@media(min-height:441px) and (max-height:580px) and (orientation:landscape){
  .safe-top,.safe-bottom{height:0}
  .hdr{padding:4px 14px}
  .hdr h1{font-size:16px}
  .hdr .sub{font-size:10px}
  .hdr::after{height:24px;bottom:-12px;left:-12px;right:-12px}
  .nav{padding:2px 10px}
  .nav button{width:32px;height:32px;font-size:14px}
  .nav .ml{font-size:13px}
  .nav .me{font-size:16px}
  .credit{display:none}
  .dht{font-size:9px;padding:2px 0}
  .dh,.grid-wrap{gap:2px;padding:0 5px}
  .grid-wrap{padding-bottom:4px}
  .c{min-height:36px!important;padding:2px;gap:1px;border-radius:5px;border-width:1.5px}
  .c .n{font-size:10px}
  .c .b{font-size:5.5px;padding:1px 2px;line-height:1.2;border-radius:3px}
  .color-wash{inset:-14px;border-radius:14px}
}

/* ── Landscape: tablet landscape with decent height ── */
@media(min-height:581px) and (max-height:720px) and (min-width:768px) and (orientation:landscape){
  .safe-top,.safe-bottom{height:0}
  .hdr{padding:6px 16px}
  .hdr h1{font-size:18px}
  .hdr .sub{font-size:11px}
  .nav{padding:3px 12px}
  .credit{display:none}
  .ft{display:none}
  .c{min-height:50px!important;padding:3px;gap:1px}
  .c .n{font-size:12px}
  .c .b{font-size:6.5px;padding:1px 3px}
  .dht{font-size:10px;padding:3px 0}
  .dh,.grid-wrap{gap:3px}
}

/* ── Landscape: desktop monitor (plenty of space) ── */
@media(min-width:1200px) and (orientation:landscape){
  .credit{display:block}
  .ft{display:block}
}

@media(prefers-reduced-motion:reduce){
  .bg-anim,.blob,.cg,.color-wash{transition:none!important}
  .bg-anim{animation:none!important}
  .blob{animation:none!important}
  *{transition-duration:0s!important;animation-duration:0s!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bg-anim" id="bgA"></div>
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div class="blob" id="b3"></div>
  <div class="safe-top" id="safeTop"></div>
  <div class="dl"><svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 500 1200" id="dSvg"></svg></div>
  <div class="hdr" id="hdr"><h1>Emma's Calendar</h1><div class="sub" id="hSub">2026</div></div>
  <div class="nav">
    <button id="pB" aria-label="Previous month">&#9664;</button>
    <div class="ml" id="mLbl"></div>
    <button id="nB" aria-label="Next month">&#9654;</button>
  </div>
  <div class="cw" id="cw">
    <div class="dh" id="dh"></div>
    <div class="grid-wrap" id="gridWrap">
      <div class="color-wash" id="colorWash"></div>
      <div class="cg" id="gC"></div>
    </div>
    <div class="ft" id="ftH">tap a day to edit</div>
  </div>
  <div class="credit" id="credit">Made by Lee Williams</div>
  <div class="safe-bottom"></div>
</div>
<div class="mo" id="mo">
  <div class="ms">
    <div class="mh"></div>
    <div class="mt">Edit Entries</div>
    <div class="md" id="mD"></div>
    <div class="mel-list" id="mL"></div>
    <div class="mar">
      <input class="mi" id="mI" type="text" placeholder="New entry..." maxlength="20" autocomplete="off">
      <div class="mcs" id="mCs"></div>
      <button class="mab" id="mAB">Add</button>
    </div>
    <button class="mcl" id="mCL">Close</button>
  </div>
</div>

<script>
function E(c){return String.fromCodePoint(c)}
var S1=E(0x2744),S2=E(0x26C4),S3=E(0x1F328),TU=E(0x1F337),SF=E(0x1F33B),CH=E(0x1F338),BF=E(0x2618),SU=E(0x2600),HI=E(0x1F33A),ME=E(0x1F349),BE=E(0x1F3D6);
var L1=E(0x1F342),L2=E(0x1F341),NU=E(0x1F330),PU=E(0x1F383),XM=E(0x1F384),HT=E(0x1F496);
var EG=E(0x1F95A),EK=E(0x1F420),EBN=E(0x1F380),EBL=E(0x1F308),EFL=E(0x1F33C);
var GH=E(0x1F47B),SK=E(0x1F378),BT=E(0x1F383),WN=E(0x1F43A),SP=E(0x1F47E),CT=E(0x1F479),MU=E(0x1F9B8);
var SD=E(0x1F384),TR=E(0x1F385),NO=E(0x1F386),RD=E(0x1F381);
var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function sf(x,y,s,o){var h='<g opacity="'+o+'" stroke="#64b5f6" stroke-width="'+Math.max(1,s/8)+'" stroke-linecap="round">';for(var a=0;a<360;a+=60){var r=a*Math.PI/180;h+='<line x1="'+x+'" y1="'+y+'" x2="'+(x+s*Math.cos(r))+'" y2="'+(y+s*Math.sin(r))+'"/>';var b=s*.55,bx=x+b*Math.cos(r),by=y+b*Math.sin(r);h+='<line x1="'+bx+'" y1="'+by+'" x2="'+(bx+s*.3*Math.cos(r+.7))+'" y2="'+(by+s*.3*Math.sin(r+.7))+'"/>';h+='<line x1="'+bx+'" y1="'+by+'" x2="'+(bx+s*.3*Math.cos(r-.7))+'" y2="'+(by+s*.3*Math.sin(r-.7))+'"/>'}return h+'</g>'}
function bt(x,y,s,o,c){c=c||'#5d4037';var h=130*s,w=70*s;return '<g opacity="'+o+'" stroke="'+c+'" stroke-linecap="round" fill="none"><line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-h)+'" stroke-width="'+(4*s)+'"/><line x1="'+x+'" y1="'+(y-h)+'" x2="'+(x-w*.4)+'" y2="'+(y-h-w*.9)+'" stroke-width="'+(2.5*s)+'"/><line x1="'+x+'" y1="'+(y-h)+'" x2="'+(x+w*.4)+'" y2="'+(y-h-w*.7)+'" stroke-width="'+(2*s)+'"/><line x1="'+x+'" y1="'+(y-h*.6)+'" x2="'+(x-w*.35)+'" y2="'+(y-h*.85)+'" stroke-width="'+1.8*s+'"/><line x1="'+x+'" y1="'+(y-h*.7)+'" x2="'+(x+w*.3)+'" y2="'+(y-h*.9)+'" stroke-width="'+1.5*s+'"/></g>'}

    var isSun=(new Date(YR,m,d).getDay()===0);ev=gA(m,d);bg=isSun?t.csb:t.cbr;bd=isSun?t.csb:t.cbr;
    var cell='<div class="c'+(isSun?' su':'')+'" style="background:'+bg+';border-color:'+bd+'" data-d="'+d+'" data-m="'+m+'"><span class="n" style="color:'+t.nc+'">'+d+'</span>';
    for(j=0;j<ev.length;j++)cell+='<span class="b '+ev[j].c+'">'+ev[j].l+'</span>';
    parts.push(cell+'</div>');
  }
  var rem=(off+dim)%7;if(rem>0)for(i=0;i<7-rem;i++)parts.push('<div class="c e"></div>');
  return parts.join('');
}

function applyTheme(m){
  var t=TH[gT(m)];
  var showAnim=t.animBg&&!reducedMotion;
  $bgA.style.animationPlayState=showAnim?'running':'paused';
  $b1.style.animationPlayState=showAnim?'running':'paused';
  $b2.style.animationPlayState=showAnim?'running':'paused';
  $b3.style.animationPlayState=showAnim?'running':'paused';
  $bgA.style.background=t.ba;$safeTop.style.background=t.st;
  var tKey=t.s;
  if($b1._tk!==tKey){$b1._tk=tKey;$b1.style.background=t.bl[0];$b2.style.background=t.bl[1];$b3.style.background=t.bl[2]}
  $hdr.style.background=t.hd;$hSub.style.color=t.hs;
  if(!$hdr._as){$hdr._as=document.createElement('style');$hdr._as.id='haS';document.head.appendChild($hdr._as)}
  $hdr._as.textContent='.hdr::after{background:'+t.ha+'!important}';
  if($dhEls._tk!==tKey){$dhEls._tk=tKey;for(var h=0;h<$dhEls.length;h++){$dhEls[h].style.background=t.dhb;$dhEls[h].style.color=t.dhc}}
  $ftH.style.color=t.hc;$credit.style.color=t.fc;
  $pB.style.background=t.bc;$pB.style.color=t.dhc;$nB.style.background=t.bc;$nB.style.color=t.dhc;
  $pB.style.opacity=cM===0?'.25':'1';$pB.disabled=cM===0;
  $nB.style.opacity=cM===11?'.25':'1';$nB.disabled=cM===11;
  $mLbl.innerHTML='<span class="me">'+mE[cM]+'</span> '+mN[cM];$mLbl.style.color=t.dhc;
  $hSub.textContent=t.s+' \u00B7 2026';
  $dSvg.innerHTML=reducedMotion?'':t.d;
  $gC.innerHTML=bGH(cM);
}

function gM(dir){
  if(fr)return;var nm=cM+dir;if(nm<0||nm>11)return;
  fr=true;
  var newTheme=TH[gT(nm)];
  var washX=dir>0?'78%':'22%';
  $colorWash.style.background='radial-gradient(ellipse at '+washX+' 50%, '+newTheme.hd+' 0%, '+newTheme.hd+'44 25%, transparent 68%)';
  $colorWash.style.transformOrigin=dir>0?'right center':'left center';
  $gC.classList.add('blend-out');
  $colorWash.classList.add('active');
  setTimeout(function(){
    cM=nm;
    $gC.style.transition='none';
    $gC.classList.remove('blend-out');
    $gC.classList.add('blend-in');
    applyTheme(cM);
    $cw.scrollTop=0;
    void $gC.offsetWidth;
    $gC.style.transition='';
    $colorWash.classList.remove('active');
    $gC.classList.remove('blend-in');
    setTimeout(function(){fr=false},360);
  },340);
}

function initRefs(){
  $bgA=document.getElementById('bgA');$safeTop=document.getElementById('safeTop');
  $b1=document.getElementById('b1');$b2=document.getElementById('b2');$b3=document.getElementById('b3');
  $hdr=document.getElementById('hdr');$hSub=document.getElementById('hSub');$mLbl=document.getElementById('mLbl');
  $ftH=document.getElementById('ftH');
  $pB=document.getElementById('pB');$nB=document.getElementById('nB');
  $dhEls=document.querySelectorAll('.dht');
  $gC=document.getElementById('gC');
  $dSvg=document.getElementById('dSvg');$cw=document.getElementById('cw');$credit=document.getElementById('credit');
  $colorWash=document.getElementById('colorWash');$gridWrap=document.getElementById('gridWrap');
}

function initEvents(){
  $pB.addEventListener('click',function(){gM(-1)});$nB.addEventListener('click',function(){gM(1)});
  var tX=0,tY=0,sw=false;
  $cw.addEventListener('touchstart',function(ev){if(sw||fr)return;tX=ev.touches[0].clientX;tY=ev.touches[0].clientY},{passive:true});
  $cw.addEventListener('touchend',function(ev){
    if(sw||fr)return;var dx=ev.changedTouches[0].clientX-tX,dy=ev.changedTouches[0].clientY-tY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){sw=true;if(dx<0)gM(1);else gM(-1);setTimeout(function(){sw=false},900)}
  },{passive:true});
  document.addEventListener('keydown',function(ev){if(ev.key==='ArrowLeft')gM(-1);if(ev.key==='ArrowRight')gM(1)});
  $gridWrap.addEventListener('click',function(ev){
    var cell=ev.target.closest('.c');if(!cell||cell.classList.contains('e'))return;
    var d=parseInt(cell.getAttribute('data-d')),m=parseInt(cell.getAttribute('data-m'));
    if(!isNaN(d)&&!isNaN(m))oM(m,d);
  });
  document.getElementById('mAB').addEventListener('click',aE);
  document.getElementById('mI').addEventListener('keydown',function(ev){if(ev.key==='Enter')aE()});
  document.getElementById('mCL').addEventListener('click',function(){document.getElementById('mo').classList.remove('sh')});
  document.getElementById('mo').addEventListener('click',function(ev){if(ev.target===this)this.classList.remove('sh')});
}

var mD=0,mmD=0;
function oM(m,d){
  mmD=m;mD=d;var d2=new Date(YR,m,d),dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('mD').textContent=dn[d2.getDay()]+', '+mN[m]+' '+d+', '+YR;
  rML();rCP();document.getElementById('mI').value='';document.getElementById('mo').classList.add('sh');
  setTimeout(function(){document.getElementById('mI').focus()},300);
}
function rML(){
  var ev=gA(mmD,mD),list=document.getElementById('mL');
  if(!ev.length){list.innerHTML='<div style="text-align:center;padding:14px;color:#aaa;font-weight:600;font-size:12px">No entries for this day</div>';list.onclick=null;return}
  var parts=[];
  for(var i=0;i<ev.length;i++){
    var e=ev[i],dc,tt,tbg;
    if(e.d===1){var info=DE[e.c];dc=info.g;tt=info.l;tbg=info.c}
    else{dc=CL[e.ci].g;tt='custom';tbg=CL[e.ci].f}
    parts.push('<div class="me-item"><div class="mec" style="background:'+dc+'"></div><div class="mel-label">'+e.l+'</div><span class="met" style="background:'+tbg+';color:#fff">'+tt+'</span><button class="med" data-idx="'+i+'" data-c="'+e.c+'" data-d="'+e.d+'">\u2715</button></div></div>');
  }
  list.innerHTML=parts.join('');
  list.onclick=function(ev){
    var btn=ev.target.closest('.med');if(!btn)return;
    var isDef=parseInt(btn.getAttribute('data-d'))===1,idx=parseInt(btn.getAttribute('data-idx'));
    if(isDef){var c=btn.getAttribute('data-c');rD[rK(mmD,mD,c)]=true;sR()}
    else{var k=eK(mmD,mD),cu=cE[k];if(!cu)return;var ev2=gA(mmD,mD),dc=0;for(var l=0;l<ev2.length;l++){if(ev2[l].d===1)dc++;else break}var ci=idx-dc;if(ci>=0&&ci<cu.length){cu.splice(ci,1);if(!cu.length)delete cE[k];sC()}}
    rML();rG();
  };
}
function rCP(){
  var parts=[];for(var i=0;i<CL.length;i++)parts.push('<button class="mcb'+(i===pc?' pk':'')+'" style="background:'+CL[i].f+'" data-ci="'+i+'"></button>');
  var mcs=document.getElementById('mCs');mcs.innerHTML=parts.join('');
  mcs.onclick=function(ev){var btn=ev.target.closest('.mcb');if(!btn)return;pc=parseInt(btn.getAttribute('data-ci'));rCP()};
}
function aE(){var inp=document.getElementById('mI'),label=inp.value.trim();if(!label)return;var k=eK(mmD,mD);if(!cE[k])cE[k]=[];cE[k].push({l:label,ci:pc});sC();inp.value='';rML();rG()}
function rG(){$gC.innerHTML=bGH(cM)}

var animStyle=document.createElement('style');
animStyle.textContent=
  '@keyframes ch{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}'+
  '@keyframes cw{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(4px) rotate(2deg)}75%{transform:translateX(-4px) rotate(-2deg)}}'+
  '@keyframes cf{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.04)}}'+
  '@keyframes cs{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}'+
  '@keyframes cb{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(-10px) scaleY(.9)}50%{transform:translateY(0) scaleY(1.08)}70%{transform:translateY(-4px) scaleY(1)}}'+
  '@keyframes blink{0%{opacity:.15}100%{opacity:1}}'+
  '@keyframes flicker{0%{opacity:.5}100%{opacity:1}}';
document.head.appendChild(animStyle);

document.getElementById('dh').innerHTML=
  '<div class="dht">Mon</div><div class="dht">Tue</div><div class="dht">Wed</div>'+
  '<div class="dht">Thu</div><div class="dht">Fri</div><div class="dht">Sat</div><div class="dht">Sun</div>';

initRefs();initEvents();applyTheme(0);
</script>
