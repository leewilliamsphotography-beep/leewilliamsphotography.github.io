<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Emma's Calendar">
<title>Emma's Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;overscroll-behavior:none}

  .app{
    display:flex;flex-direction:column;
    height:100%;height:100dvh;
    max-width:500px;margin:0 auto;
    position:relative;overflow:hidden;
    transition:background 0.6s ease;
  }
  .safe-top{height:env(safe-area-inset-top,0px);flex-shrink:0;transition:background 0.6s ease}
  .safe-bottom{height:env(safe-area-inset-bottom,0px);flex-shrink:0}

  .app-header{
    padding:14px 16px 14px;text-align:center;flex-shrink:0;
    position:relative;overflow:hidden;transition:background 0.6s ease;
  }
  .app-header::after{
    content:'';position:absolute;bottom:-20px;left:-20px;right:-20px;
    height:40px;border-radius:50%;transition:background 0.6s ease;
  }
  .app-header h1{
    font-family:'Quicksand',sans-serif;font-weight:700;
    font-size:20px;color:white;position:relative;z-index:1;
  }
  .app-header .subtitle{
    font-family:'Quicksand',sans-serif;font-weight:600;
    font-size:13px;opacity:0.75;margin-top:2px;
    position:relative;z-index:1;color:white;transition:color 0.6s;
  }

  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px 6px;flex-shrink:0;
  }
  .month-nav button{
    width:42px;height:42px;border:none;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:20px;transition:background 0.3s,transform 0.15s;
  }
  .month-nav button:active{transform:scale(0.9)}
  .month-nav .month-label{
    font-family:'Quicksand',sans-serif;font-weight:700;
    font-size:17px;display:flex;align-items:center;gap:6px;transition:color 0.6s ease;
  }
  .month-nav .month-emoji{font-size:20px}

  .legend{
    display:flex;justify-content:center;flex-wrap:wrap;
    gap:5px;padding:4px 8px 8px;flex-shrink:0;
  }
  .legend-chip{
    display:flex;align-items:center;gap:3px;
    background:rgba(255,255,255,0.7);padding:3px 7px;border-radius:12px;
    font-size:9.5px;font-weight:600;
    border:1px solid rgba(255,255,255,0.4);
    transition:background 0.6s, border-color 0.6s;
  }
  .legend-dot{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;color:white;flex-shrink:0;
  }

  .cal-wrapper{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:0 8px 8px;-webkit-overflow-scrolling:touch;
  }
  .day-headers{
    display:grid;grid-template-columns:repeat(7,1fr);
    gap:3px;padding:0 2px;margin-bottom:3px;
  }
  .day-hdr{
    text-align:center;font-family:'Quicksand',sans-serif;
    font-weight:700;font-size:11px;padding:5px 0;
    border-radius:6px;transition:background 0.6s, color 0.6s;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cell{
    border-radius:8px;padding:3px 4px;border:1.5px solid transparent;
    display:flex;flex-direction:column;justify-content:flex-start;gap:1px;
    min-height:54px;transition:transform 0.15s, background 0.6s, border-color 0.6s;
  }
  .cell:active{transform:scale(0.96)}
  .cell.empty{background:transparent!important;border-color:transparent!important;min-height:0}
  .cell.sunday{transition:background 0.6s, border-color 0.6s}
  .cell .num{font-weight:800;font-size:13px;line-height:1.1;transition:color 0.6s}
  .cell .badge{
    padding:1px 3px;border-radius:4px;font-size:6.5px;font-weight:700;
    color:white;text-align:center;line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .b-shop{background:#e91e63}
  .b-swim{background:#0288d1}
  .b-clean{background:#ef6c00}
  .b-film{background:#7b1fa2}
  .b-work{background:#2e7d32}

  .app-footer{
    text-align:center;padding:8px 12px;
    border-top:1.5px solid rgba(255,255,255,0.3);
    flex-shrink:0;transition:border-color 0.6s;
  }
  .app-footer .flowers{font-size:12px;letter-spacing:2px;margin-bottom:2px}
  .app-footer p{font-size:9px;opacity:0.6;font-weight:600;transition:color 0.6s}

  .deco-layer{
    position:absolute;inset:0;pointer-events:none;
    z-index:0;overflow:hidden;transition:opacity 0.6s ease;
  }
  .swipe-hint{
    text-align:center;padding:4px;font-size:10px;
    opacity:0.35;font-weight:600;flex-shrink:0;transition:color 0.6s;
  }

  .splash{
    position:fixed;inset:0;z-index:200;
    background:linear-gradient(180deg,#1b5e20 0%,#2e7d32 50%,#c8e6c9 100%);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transition:opacity 0.5s,transform 0.5s;
  }
  .splash.hide{opacity:0;transform:scale(1.1);pointer-events:none}
  .splash h2{font-family:'Quicksand',sans-serif;font-weight:700;font-size:28px;color:white;margin-bottom:4px}
  .splash p{font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:rgba(255,255,255,0.8);margin-bottom:24px}
  .splash .splash-icon{font-size:64px;margin-bottom:16px;animation:bounce 1s ease infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .splash .loader{width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .install-banner{
    display:none;position:fixed;bottom:0;left:0;right:0;
    background:white;padding:14px 16px;box-shadow:0 -2px 20px rgba(0,0,0,0.15);
    z-index:100;max-width:500px;margin:0 auto;
  }
  .install-banner.show{display:flex;align-items:center;gap:12px}
  .install-banner .install-icon{
    width:42px;height:42px;border-radius:10px;
    background:linear-gradient(135deg,#e91e63,#f06292);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  .install-banner .install-text{flex:1}
  .install-banner .install-text strong{display:block;font-size:13px;color:#333;font-family:'Quicksand',sans-serif}
  .install-banner .install-text span{font-size:11px;color:#888}
  .install-banner .install-btn{
    border:none;padding:8px 18px;border-radius:20px;
    background:#e91e63;color:white;font-family:'Quicksand',sans-serif;
    font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;
  }
  .install-banner .install-dismiss{border:none;background:none;font-size:18px;color:#bbb;cursor:pointer;padding:4px}
  .install-spacer{height:70px}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-icon">📅</div>
  <h2>Emma's Calendar</h2>
  <p>2026</p>
  <div class="loader"></div>
</div>

<div class="app" id="app">
  <div class="safe-top" id="safeTop"></div>
  <div class="deco-layer" id="decoLayer"></div>
  <div class="app-header" id="appHeader">
    <h1>Emma's Calendar</h1>
    <div class="subtitle" id="headerSub">2026</div>
  </div>
  <div class="month-nav">
    <button id="prevBtn" aria-label="Previous month">◀</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn" aria-label="Next month">▶</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="cal-wrapper" id="calWrapper">
    <div class="day-headers" id="dayHeaders"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="swipe-hint" id="swipeHint">← swipe to change month →</div>
  </div>
  <div class="app-footer" id="appFooter">
    <div class="flowers" id="footerFlowers"></div>
    <p>Emma's Routine Calendar — Have a lovely Christmas!</p>
  </div>
  <div class="safe-bottom"></div>
</div>

<div class="install-banner" id="installBanner">
  <div class="install-icon">📅</div>
  <div class="install-text"><strong>Install Emma's Calendar</strong><span>Add to home screen for quick access</span></div>
  <button class="install-btn" id="installBtn">Install</button>
  <button class="install-dismiss" id="dismissBtn">✕</button>
</div>

// ── Decoration Helpers ──
function snowflake(cx,cy,size,op){
  let s=`<g opacity="${op}" stroke="#90caf9" stroke-width="${Math.max(1,size/8)}" stroke-linecap="round">`;
  for(let a=0;a<360;a+=60){
    const r=a*Math.PI/180;
    s+=`<line x1="${cx}" y1="${cy}" x2="${cx+size*Math.cos(r)}" y2="${cy+size*Math.sin(r)}"/>`;
    const b=size*0.55,bx=cx+b*Math.cos(r),by=cy+b*Math.sin(r);
    s+=`<line x1="${bx}" y1="${by}" x2="${bx+size*0.3*Math.cos(r+0.7)}" y2="${by+size*0.3*Math.sin(r+0.7)}"/>`;
    s+=`<line x1="${bx}" y1="${by}" x2="${bx+size*0.3*Math.cos(r-0.7)}" y2="${by+size*0.3*Math.sin(r-0.7)}"/>`;
    const b2=size*0.8,bx2=cx+b2*Math.cos(r),by2=cy+b2*Math.sin(r);
    s+=`<line x1="${bx2}" y1="${by2}" x2="${bx2+size*0.2*Math.cos(r+0.55)}" y2="${by2+size*0.2*Math.sin(r+0.55)}"/>`;
    s+=`<line x1="${bx2}" y1="${by2}" x2="${bx2+size*0.2*Math.cos(r-0.55)}" y2="${by2+size*0.2*Math.sin(r-0.55)}"/>`;
  }
  s+=`<circle cx="${cx}" cy="${cy}" r="${Math.max(1,size*0.08)}" fill="#90caf9" stroke="none"/>`;
  s+=`</g>`;return s;
}

function bareTree(x,y,scale,op){
  const h=130*scale;
  let s=`<g opacity="${op}" transform="translate(${x}%,${y}%)">`;
  s+=`<line x1="50%" y1="100%" x2="50%" y2="${100-h}%" stroke="#5d4037" stroke-width="${4*scale}" stroke-linecap="round"/>`;
  s+=`<line x1="50%" y1="${100-h}%" x2="${50-30*scale}%" y2="${100-h-70*scale}%" stroke="#5d4037" stroke-width="${2.5*scale}" stroke-linecap="round"/>`;
  s+=`<line x1="50%" y1="${100-h}%" x2="${50+30*scale}%" y2="${100-h-50*scale}%" stroke="#5d4037" stroke-width="${2*scale}" stroke-linecap="round"/>`;
  s+=`<line x1="50%" y1="${100-h*0.6}%" x2="${50-25*scale}%" y2="${100-h*0.85}%" stroke="#5d4037" stroke-width="${1.8*scale}" stroke-linecap="round"/>`;
  s+=`<line x1="50%" y1="${100-h*0.7}%" x2="${50+20*scale}%" y2="${100-h*0.9}%" stroke="#5d4037" stroke-width"${1.5*scale}" stroke-linecap="round"/>`;

function stringLights(startY, endY, radius, bulbR) {
  let s = `<g>`;
  const count = Math.round((endY - startY) / 38);
  const colours = ['#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5','#e53935','#ffd600','#1e88e5'];
  // String/wire
  const wireY1 = startY - radius * 1.8;
  s += `<path d="M0 ${wireY1} Q25% ${startY - radius} 50% ${startY} Q75% ${startY + radius} 100% ${wireY1}" fill="none" stroke="#2e7d32" stroke-width="1.5" opacity="0.25"/>`;
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const x = (t * 100).toFixed(2);
    const y = (startY + t * (wireY1 - startY + radius * 1.8)).toFixed(2);
    const c = colours[i % colours.length];
    // Glow
    s += `<circle cx="${x}" cy="${y}" r="${bulbR}" fill="${c}" opacity="0.18"/>`;
    // Bulb
    s += `<circle cx="${x}" cy="${y}" r="${bulbR * 0.65}" fill="${c}"/>`;
    // Shine
    s += `<circle cx="${(parseFloat(x) - bulbR * 0.25)}" cy="${(parseFloat(y) - bulbR * 0.35}" r="${bulbR * 0.3}" fill="white" opacity="0.45"/>`;
  }
  s += `</g>`;
  return s;
}

function bigTree(x, y, scale, op) {

  s += `<polygon points="50% ${100-h-5}% 50% ${50-h-2}% ${50+h-2}% 50% ${50+h+2}% 50%" fill="#ffd600"/>`;

  for (let i = 1; i <= 4; i++) {
    const ty = 100 - (i * 18);
    const amp = (0.3 + Math.sin(i * 1.2) * 4;
    s += `<path d="M${50-h*0.7}% ${ty+amp}% Q50% ${ty-amp}% ${50+h*0.7}% ${ty}% Q75% ${ty+amp}% ${100+h*0.7}% ${ty}%" fill="none" stroke="#ffd600" stroke-width="1.5" opacity="0.5"/>`;

  // Baubles
  const baubles = [
    [48,-22,'#e53935',14],[52,-25,'#ffd600',12],[40,-32,'#1e88e5',11],
    [55,-14,'#e53935',10],[44,-38,'#ffd600',9],[52,-10,'#1e88e5',10],[40,-44,'#e53935',8],

function star5(cx, cy, size, op) {

function candyCane(cx, cy, height, op) {
  const w = 10;
  const h = height || 60;
  let s = `<g opacity="${op}" transform="translate(${cx}%,${cy}) rotate(-25)">`;
  // Straight part
  s += `<rect x="-${w/2}" y="-${h/2}" width="${w}" height="${h}" rx="5" fill="#e53935"/>`;
  // Curve
  s += `<path d="M0 ${-h/2} Q${w*2.5} ${-h*1.2} ${w*5} ${-h*0.7}%" stroke="#e53935" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  // White stripes
  for (let i = 0; i < Math.floor(h / 5); i++) {
    const sy = -h/2 + i * 5;
    s += `<rect x="${-w/2}" y="${sy}" width="${w}" height="2.5" rx="1" fill="white"/>`;
  }
  // Curve stripes
  for (let i = 0; i < 3; i++) {
    const a = Math.PI * (i * 0.6 + 0.2);
    const sx = w * 2 * Math.cos(a);
    const sy = -h * 0.7 + h * 1.4 * Math.sin(a);
    s += `<circle cx="${sx}" cy="${sy}" r="${w * 0.55}" fill="white"/>`;
  }
  s += `</g>`; return s;
}

function stocking(cx, cy, op) {
  const h = 0.6;
  let s = `<g opacity="${op}" transform="translate(${cx}%,${cy})">`;

  s += `<path d="M-15% 0 L-15% 100% Q-15% 108% 0% 100% Z" fill="#e53935"/>`;

}

function wreath(wcx, wcy, op) {
  const rx = 14;
  let s = `<g opacity="${op}" transform="translate(${wcx}%,${wcy}%)">`;
  // Outer ring
  s += `<circle cx="0" cy="0" r="${rx}%" fill="none" stroke="#2e7d32" stroke-width="10"/>`;
  // Inner ring
  s += `<circle cx="0" cy="0" r="${rx*0.75}" fill="none" stroke="#388e3c" stroke-width="6"/>`;
  // Holly
  s += `<ellipse cx="0" cy="${-rx*1.3}" rx="${rx*0.9}" ry="${rx*0.4}" transform="rotate(-25)" fill="#2e7d32"/>`;
  s += `<ellipse cx="0" cy="${rx*1.3}" rx="${rx*0.9}" ry="${rx*0.4}" transform="rotate(25)" fill:"#388e3c"/>`;
  // Berries
  for (let a = 0; a < 360; a += 50) {
    const rad = a * Math.PI / 180;
    const br = rx * 0.65;
    s += `<circle cx="${br * Math.cos(rad)}" cy="${br * Math.sin(rad)}" r="4" fill="#e53935"/>`;
  }
  // Red bow
  s += `<ellipse cx="-7%" cy="${rx * 1.2}%" rx="9%" ry="5.5%" fill="#e53935"/>`;
  s += `<ellipse cx="7%" cy="${rx * 1.2}%" rx="9%" ry="5.5%" fill="#e53935"/>`;
  s += `<circle cx="0" cy="${rx * 1.15}%" r="3" fill="#c62828"/>`;
  s += `<circle cx="-3" cy="${rx * 1.1}%" r="2" fill="white" opacity="0.3"/>`;
  s += `</g>`; return s;
}

// ── State ──
let currentMonth = 0;
const YEAR = 2026;
const filmStart = new Date(YEAR, 0, 8).getTime();
const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthEmojis = ['❄️','💖','🌷','🌸','🌻','🌺','☀️','🍉','🏖️','🍂','🍁','🎄'];

function getSeason(m) {
  if (m === 11) return 'christmas';
  if (m <= 1) return 'winter';
  if (m <= 4) return 'spring';
  if (m <= 7) return 'summer';
  return 'autumn';
}

function getEvents(month, day) {
  const d = new Date(YEAR, month, day), dow = d.getDay(), out = [];
  if (dow === 1) out.push({ label: 'Shopping', cls: 'b-shop' });
  if (dow === 2) out.push({ label: 'Swimming', cls: 'b-swim' });
  if (dow === 3) {
    out.push({ label: 'Swimming', cls: 'b-swim' });
    out.push({ label: 'Cleaning', cls: 'b-clean' });
  }
  if (dow === 4) {
    const diff = Math.round((d.getTime() - filmStart) / 864e5);
    if (diff >= 0 && (diff / 7) % 2 === 0) out.push({ label: 'Film Night', cls: 'b-film' });
  }
  if (dow === 5) out.push({ label: 'Work', cls: 'b-work' });
  return out;
}

// ── Render ──
function renderMonth() {
  const t = SEASONS[getSeason(currentMonth)];
  const grid = document.getElementById('calGrid');
  const label = document.getElementById('monthLabel');
  label.innerHTML = `<span class="month-emoji">${monthEmojis[currentMonth]}</span> ${monthNames[currentMonth]}`;
  label.style.color = t.header;

  const daysInMonth = new Date(YEAR, currentMonth + 1, 0).getDate();
  const startOffset = (new Date(YEAR, currentMonth, 1).getDay() + 6) % 7;

  let html = '';
  for (let i = 0; i < startOffset; i++) html += `<div class="cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dow = new Date(YEAR, currentMonth, day).getDay();
    const isSun = dow === 0;
    const evts = getEvents(currentMonth, day);
    let cs = `background:${t.cellBg};border-color:${t.cellBorder};`;
    if (isSun) cs = `background:${t.sundayBg};border-color:${t.sundayBg};`;
    html += `<div class="cell${isSun ? ' sunday' : ''}" style="${cs}">`;
    html += `<span class="num" style="color:${t.numColor}">${day}</span>`;
    evts.forEach(e => { html += `<span class="badge ${e.cls}">${e.label}</span>`; });
    html += `</div>`;
  }
  const rem = (startOffset + daysInMonth) % 7;
  if (rem > 0) for (let i = 0; i < 7 - rem; i++) html += `<div class="cell empty"></div>`;
  grid.innerHTML = html;

  // Legend
  document.getElementById('legend').innerHTML = `
    <div class="legend-chip" style="background:${t.legendBg};border-color:${t.legendBorder}">
      <span class="legend-dot" style="background:#e91e63">🛒</span>Mon — Shop
    </div>
    <div class="legend-chip" style="background:${t.legendBg};border-color:${t.legendBorder}">
      <span class="legend-dot" style="background:#0288d1">🏊</span>Tue+Wed — Swim
    </div>
    <div class="legend-chip" style="background:${t.legendBg};border-color:${t.legendBorder}">
      <span class="legend-dot" style="background:#ef6c00">🧹</span>Wed — Clean
    </div>
    <div class="legend-chip" style="background:${t.legendBg};border-color:${t.legendBorder}">
      <span class="legend-dot" style="background:#7b1fa2">🎬</span>Alt Thu — Film
    </div>
    <div class="legend-chip" style="background:${t.legendBg};border-color:${t.legendBorder}">
      <span class="legend-dot" style="background:#2e7d32">💼</span>Fri — Work
    </div>
  `;

  document.getElementById('footerFlowers').textContent = t.flowers;
  document.getElementById('headerSub').textContent = `${t.sub} · 2026`;

  // Buttons
  document.getElementById('prevBtn').style.background = `${t.header}22`;
  document.getElementById('prevBtn').style.color = 'white';
  document.getElementById('nextBtn').style.background = `${t.header}22`;
  document.getElementById('nextBtn').style.color = 'white';
  document.getElementById('prevBtn').style.opacity = currentMonth === 0 ? '0.3' : '1';
  document.getElementById('nextBtn').style.opacity = currentMonth === 11 ? '0.3' : '1';
}

function applyTheme(month) {
  const t = SEASONS[getSeason(month)];
  document.getElementById('safeTop').style.background = t.safeTop;
  const header = document.getElementById('app-header');
  header.style.background = t.header;
  header.querySelector('h1').style.color = 'white';
  document.getElementById('headerSub').style.color = t.headerSub;

  let as = document.getElementById('headerAfterStyle');
  if (!as) { as = document.createElement('style'); as.id = 'headerAfterStyle'; document.head.appendChild(as); }
  as.textContent = `.app-header::after{background:${t.headerAfter}!important;}`;

  document.querySelectorAll('.day-hdr').forEach(el => { el.style.background = t.dayHdrBg; el.style.color = t.dayHdrColor; });
  document.getElementById('app-footer').style.borderTopColor = t.footerBorder;
  document.getElementById('app-footer').querySelector('p').style.color = t.footerColor;
  document.getElementById('swipeHint').style.color = t.hintColor;
  document.getElementById('decoLayer').innerHTML = t.deco;

  renderMonth();
}

function prevMonth() { if (currentMonth > 0) { currentMonth--; applyTheme(currentMonth); document.getElementById('calWrapper').scrollTop = 0; } }
function nextMonth() { if (currentMonth < 11) { currentMonth++; applyTheme(currentMonth); document.getElementById('calWrapper').scrollTop = 0; } }

document.getElementById('prevBtn').addEventListener('click', prevMonth);
document.getElementById('nextBtn').addEventListener('click', nextMonth);

// Swipe
let touchX = 0, touchY = 0;
const wrapper = document.getElementById('calWrapper');
wrapper.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
wrapper.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? nextMonth() : prevMonth(); }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') prevMonth();
  if (e.key === 'ArrowRight') nextMonth();
});

// PWA
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) setTimeout(() => document.getElementById('installBanner').classList.add('show'), 2500);
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; document.getElementById('installBanner').classList.remove('show'); deferredPrompt = null; }
});
document.getElementById('dismissBtn').addEventListener('click', () => {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('installDismissed', 'true');
});
